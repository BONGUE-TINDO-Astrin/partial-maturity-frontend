<nav
  class="flex min-h-7 flex-wrap items-center gap-1 text-xs text-belife-text-secondary"
  aria-label="Chemin de navigation"
>
  <a
    routerLink="/app/dashboard"
    class="font-medium transition-colors hover:text-belife-primary"
  >
    Accueil
  </a>

  @for (
    item of items();
    track item.url;
    let last = $last
  ) {
    <svg
      lucideChevronRight
      class="size-3.5 shrink-0 text-belife-text-muted"
      aria-hidden="true"
    ></svg>

    @if (last) {
      <span
        class="max-w-64 truncate font-semibold text-belife-text"
        aria-current="page"
        [title]="item.label"
      >
        {{ item.label }}
      </span>
    } @else {
      <a
        [routerLink]="item.url"
        class="max-w-48 truncate font-medium transition-colors hover:text-belife-primary"
        [title]="item.label"
      >
        {{ item.label }}
      </a>
    }
  }
</nav>
