<div class="min-h-screen bg-belife-background">
  <app-side-menu
    [mobileOpen]="mobileMenuOpen()"
    (closeMobileMenu)="closeMobileMenu()"
  />

  <div class="min-h-screen lg:pl-72">
    <app-top-bar
      (openMobileMenu)="openMobileMenu()"
    />

    <main class="min-w-0" id="main-content">
      <div
        class="mx-auto w-full max-w-[var(--belife-content-max-width)] px-4 pt-3 lg:px-6"
      >
        <app-navigation-path />
      </div>

      <router-outlet />
    </main>
  </div>
</div>
